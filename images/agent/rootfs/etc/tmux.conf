# Dockerbox defaults: mouse scrolling, large history, true colour.
set -g mouse on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g escape-time 10
set -g status-style "bg=#262626,fg=#a3a3a3"
set -g status-left "#[fg=#4ade80]● #[fg=#ececec]#h "
set -g status-left-length 40
set -g status-right "%H:%M"

# The browser console handles copy & paste: no tmux right-click menu (it
# covered the browser's context menu). Select text with Shift + drag.
unbind-key -n MouseDown3Pane
unbind-key -n M-MouseDown3Pane
unbind-key -n MouseDown3Status
unbind-key -n MouseDown3StatusLeft
unbind-key -n MouseDown3StatusRight
unbind-key -n M-MouseDown3Status
unbind-key -n M-MouseDown3StatusLeft
